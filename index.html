<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrolist Now Playing</title>
<style>
  :root {
    --white: #fff;
    --muted: rgba(255, 255, 255, .78);
    --subtle: rgba(255, 255, 255, .62);
    --bar-a: #09c;
    --bar-b: #f44;
    --artist-size: clamp(18px, 20vh, 34px);
    --title-size: clamp(12px, 13vh, 20px);
    --time-size: clamp(10px, 12vh, 16px);
    --subtitle-size: clamp(9px, 10vh, 14px);
    --gap: clamp(10px, 2.8vh, 20px);
    --side: clamp(12px, 2.6vw, 24px);
    --bottom: clamp(20px, 13vh, 28px);
    --time-reserve: clamp(70px, 15vw, 150px);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }

  body {
    color: var(--white);
    font-family: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- full-bleed blurred artwork background ---------- */

  #app {
    position: relative;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 400ms ease;
  }

  body:not(.offline):not(.paused) #app,
  body.not-hide-on-pause.paused:not(.offline) #app {
    opacity: 1;
  }

  .artist-background {
    position: absolute;
    inset: -6%;
    overflow: hidden;
    opacity: 0;
    transform: scale(1.08);
    filter: blur(26px) saturate(1.15) brightness(.8);
    pointer-events: none;
    transition: opacity 550ms ease;
  }

  .artist-background.show { opacity: 1; }

  .artist-background img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .color-background {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .62);
    pointer-events: none;
  }

  body.transparent-background .artist-background,
  body.transparent-background .color-background {
    display: none;
  }

  /* ---------- row layout ---------- */

  .song-info {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: var(--gap);
    width: 100%;
    height: 100%;
    padding: clamp(8px, 5vh, 16px) var(--side) var(--bottom);
  }

  body.right .song-info { flex-direction: row-reverse; }

  /* ---------- circular album art ---------- */

  .art-frame {
    position: relative;
    flex: 0 0 auto;
    height: 100%;
    aspect-ratio: 1 / 1;
  }

  .art {
    position: absolute;
    inset: 6%;
    overflow: hidden;
    border-radius: 50%;
    background: linear-gradient(145deg, #2c2c2c, #121212);
    box-shadow: 0 0 0 clamp(5px, 1.1vmax, 11px) rgba(0, 0, 0, .22);
  }

  .art::before {
    content: "\266A";
    position: absolute;
    inset: 0;
    z-index: 0;
    display: grid;
    place-items: center;
    font-size: min(30vh, 52px);
    color: #4a4a4a;
    user-select: none;
  }

  .art-spin {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .art-spin img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 450ms ease;
  }

  .art-spin img.show { opacity: 1; }

  body.album-spin .art-spin {
    animation: album-spin 60s linear infinite;
  }

  body.album-spin.paused .art-spin {
    animation-play-state: paused;
  }

  @keyframes album-spin {
    from { transform: scale(1.43) rotate(0deg); }
    to   { transform: scale(1.43) rotate(360deg); }
  }

  /* ---------- circular progress ring ---------- */

  .art-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transform: rotate(-90deg);
    pointer-events: none;
  }

  body.circle-progressbar .art-ring { opacity: 1; }

  .ring-track,
  .ring-value {
    fill: none;
    stroke-width: 2.6;
  }

  .ring-track { stroke: rgba(255, 255, 255, .18); }

  .ring-value {
    stroke: rgba(255, 255, 255, .9);
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    transition: stroke-dashoffset 200ms linear;
  }

  body.no-duration .art-ring { display: none; }

  /* ---------- pause indicator ---------- */

  .pause-overlay {
    position: absolute;
    inset: 6%;
    z-index: 2;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8%;
    border-radius: 50%;
    background: rgba(0, 0, 0, .45);
  }

  .pause-overlay span {
    width: 12%;
    height: 34%;
    border-radius: 3px;
    background: #fff;
  }

  body.blink-pause.paused:not(.offline) .pause-overlay {
    display: flex;
    animation: pause-blink 2s ease-in-out infinite;
  }

  @keyframes pause-blink {
    0%, 100% { opacity: .95; }
    50%      { opacity: .45; }
  }

  body.disable-albumimage .art-frame,
  body.disable-albumimage .pause-overlay {
    display: none;
  }

  /* ---------- text ---------- */

  .text {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .subtitle {
    margin-bottom: clamp(2px, .6vh, 5px);
    font-size: var(--subtitle-size);
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--subtle);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .text-stack {
    display: grid;
    min-height: calc(var(--artist-size) * 1.08 * 2 + var(--title-size) * 1.25 + 5px);
    min-width: 0;
  }

  .text-layer {
    grid-area: 1 / 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    min-width: 0;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 250ms ease, transform 250ms ease;
  }

  .text-layer.show {
    opacity: 1;
    transform: translateY(0);
  }

  .text-layer.out {
    opacity: 0;
    transform: translateY(-10px);
  }

  .artist {
    display: -webkit-box;
    overflow: hidden;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow-wrap: anywhere;
    font-size: var(--artist-size);
    font-weight: 600;
    line-height: 1.08;
    color: var(--white);
    text-shadow: 0 1px 4px rgba(0, 0, 0, .25);
  }

  .title {
    min-width: 0;
    overflow: hidden;
    font-size: var(--title-size);
    font-weight: 400;
    line-height: 1.25;
    color: var(--muted);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .25);
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  /* Keep the title's glyphs out of the bottom time's corner. */
  body:not(.disable-time):not(.disable-progressbar):not(.circle-progressbar):not(.no-duration) .title {
    padding-right: var(--time-reserve);
  }

  body.right:not(.disable-time):not(.disable-progressbar):not(.circle-progressbar):not(.no-duration) .title {
    padding-right: 0;
    padding-left: var(--time-reserve);
  }

  @media screen and (max-width: 600px) {
    .subtitle { display: none; }
  }

  /* Short bars do not have room for the subtitle above the two-line artist. */
  @media screen and (max-height: 130px) and (max-width: 900px) {
    .subtitle { display: none; }
  }

  /* ---------- time + progress ---------- */

  .time {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    pointer-events: none;
  }

  .time-container {
    position: absolute;
    right: var(--side);
    bottom: clamp(7px, 1.6vh, 12px);
    font-size: var(--time-size);
    font-weight: 400;
    letter-spacing: .02em;
    color: rgba(255, 255, 255, .9);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .35);
    white-space: nowrap;
  }

  body.right .time-container {
    right: auto;
    left: var(--side);
  }

  .time-sep {
    margin: 0 .35em;
    opacity: .65;
  }

  .progress-track {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: clamp(2px, 1.5vh, 4px);
    background: rgba(0, 0, 0, .55);
  }

  .progress-fill {
    width: 0;
    height: 100%;
    background: linear-gradient(90deg, var(--bar-a), var(--bar-b));
    transition: width 200ms linear;
  }

  body.disable-time .time-container { display: none; }
  body.disable-progressbar .time { display: none; }
  body.circle-progressbar .time { display: none; }
  body.no-duration .time { display: none; }

  /* ---------- compact text-only mode ---------- */

  @media screen and (max-height: 100px) {
    .song-info {
      padding: 0 14px;
    }

    .art-frame,
    .time,
    .subtitle {
      display: none;
    }

    .text-stack {
      min-height: 0;
    }

    .text-layer {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      transform: none;
      transition: opacity 200ms ease;
    }

    .text-layer.out {
      transform: none;
    }

    .artist,
    .title {
      display: inline;
      white-space: nowrap;
      text-overflow: clip;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .25);
    }

    .title {
      padding-right: 0 !important;
      padding-left: 0 !important;
    }

    .artist {
      font-size: clamp(15px, 4.6vw, 24px);
      font-weight: 500;
    }

    .title {
      font-size: clamp(13px, 4vw, 22px);
    }

    .title::before {
      content: " - ";
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #app,
    .artist-background,
    .art-spin img,
    .text-layer {
      transition-duration: 1ms;
    }

    .art-spin,
    .pause-overlay {
      animation: none !important;
    }
  }
</style>
</head>
<body class="offline paused">
<div id="app">
  <div class="artist-background" id="bgA"><img alt=""></div>
  <div class="artist-background" id="bgB"><img alt=""></div>
  <div class="color-background"></div>

  <div class="song-info">
    <div class="art-frame" aria-hidden="true">
      <div class="art">
        <div class="art-spin">
          <img id="artA" alt="">
          <img id="artB" alt="">
        </div>
      </div>
      <svg class="art-ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="47" pathLength="100"></circle>
        <circle class="ring-value" id="ringValue" cx="50" cy="50" r="47" pathLength="100"></circle>
      </svg>
      <div class="pause-overlay" aria-hidden="true"><span></span><span></span></div>
    </div>

    <div class="text">
      <div class="subtitle">Artist</div>
      <div class="text-stack">
        <div class="text-layer" id="layerA">
          <div class="artist"></div>
          <div class="title"></div>
        </div>
        <div class="text-layer" id="layerB">
          <div class="artist"></div>
          <div class="title"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="time" aria-hidden="true">
    <div class="time-container">
      <span id="timeCurrent">0:00</span><span class="time-sep">/</span><span id="timeTotal">0:00</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const DEFAULT_BRIDGE = "http://127.0.0.1:8974";
  const POLL_MS = 1000;
  const PROGRESS_MS = 250;
  const STALE_MS = 15000;
  const FAILURES_BEFORE_FALLBACK = 2;
  const FAILURES_BEFORE_HIDE = 5;
  const DRIFT_TOLERANCE_MS = 1500;

  const FEATURE_NAMES = new Set([
    "right",
    "disable-progressbar",
    "disable-albumimage",
    "transparent-background",
    "circle-progressbar",
    "disable-time",
    "album-spin",
    "not-hide-on-pause",
    "blink-pause"
  ]);

  const body = document.body;
  const params = new URLSearchParams(location.search);

  // Accept the reference widget's ?features=a+b syntax, plus direct flags
  // such as ?right=1 or ?transparent-background.
  const requested = new Set();
  (params.get("features") || "").split(/[+\s]+/).filter(Boolean).forEach(name => requested.add(name));
  for (const [name, value] of params) {
    if (name === "features" || name === "url" || name === "port") continue;
    if (value === "" || value === "1" || value === "true") requested.add(name);
  }
  if (requested.has("blink-pause")) requested.add("not-hide-on-pause");
  for (const name of requested) {
    if (FEATURE_NAMES.has(name)) body.classList.add(name);
  }

  // ?url=http://host:port overrides the bridge. ?port=9000 is a shortcut.
  let bridge = DEFAULT_BRIDGE;
  let customBridge = false;
  const urlParam = params.get("url");
  const portParam = params.get("port");

  if (urlParam) {
    try {
      const parsed = new URL(urlParam);
      if (parsed.protocol === "http:" || parsed.protocol === "https:") {
        bridge = urlParam.replace(/\/+$/, "");
        customBridge = true;
      } else {
        console.warn("[Metrolist] Ignoring non-HTTP bridge URL:", urlParam);
      }
    } catch {
      console.warn("[Metrolist] Ignoring invalid bridge URL:", urlParam);
    }
  } else if (portParam && /^\d{1,5}$/.test(portParam)) {
    bridge = "http://127.0.0.1:" + portParam;
    customBridge = true;
  }

  const scriptSrc = customBridge ? bridge + "/current_song.js" : "current_song.js";

  const app = document.getElementById("app");
  const artA = document.getElementById("artA");
  const artB = document.getElementById("artB");
  const bgA = document.getElementById("bgA");
  const bgB = document.getElementById("bgB");
  const layerA = document.getElementById("layerA");
  const layerB = document.getElementById("layerB");
  const ringValue = document.getElementById("ringValue");
  const timeCurrent = document.getElementById("timeCurrent");
  const timeTotal = document.getElementById("timeTotal");
  const progressFill = document.getElementById("progressFill");

  let mode = location.protocol === "file:" ? "script" : "http";
  let failures = 0;
  let scriptTag = null;

  let visibleLayer = null;
  let shownKey = "";

  let visibleArt = null;
  let visibleBg = null;
  let shownArt = "";
  let artToken = 0;

  let progress = {
    anchor: 0,
    at: 0,
    duration: 0,
    playing: false
  };

  function formatTime(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const seconds = total % 60;
    if (hours > 0) {
      return hours + ":" + String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
    }
    return minutes + ":" + String(seconds).padStart(2, "0");
  }

  function renderProgress() {
    const duration = progress.duration;
    if (duration <= 0) {
      timeCurrent.textContent = "0:00";
      timeTotal.textContent = "0:00";
      progressFill.style.width = "0%";
      ringValue.style.strokeDashoffset = "100";
      return;
    }

    const elapsed = progress.playing ? performance.now() - progress.at : 0;
    const position = Math.min(duration, Math.max(0, progress.anchor + elapsed));
    const ratio = Math.min(1, Math.max(0, position / duration));

    progressFill.style.width = (ratio * 100).toFixed(3) + "%";
    ringValue.style.strokeDashoffset = String(100 - ratio * 100);
    timeCurrent.textContent = formatTime(position);
    timeTotal.textContent = formatTime(duration);
  }

  function setProgress(data, playing, force) {
    const duration = Math.max(0, Number(data.duration_ms) || 0);
    let position = Math.max(0, Number(data.position_ms) || 0);
    const updated = Number(data.updated_at) || 0;

    // Positions are sampled by the bridge. Add the time since that sample so
    // the bar matches the song between one-second polls.
    if (playing && updated > 1e12) {
      position += Math.max(0, Date.now() - updated);
    }
    if (duration > 0) position = Math.min(position, duration);

    body.classList.toggle("no-duration", duration <= 0);

    const rendered = progress.playing
      ? progress.anchor + (performance.now() - progress.at)
      : progress.anchor;

    // Ignore sub-second differences so a 1 s poll does not make the bar jump.
    const keepLocal = !force && playing && duration > 0 &&
      Math.abs(position - rendered) < DRIFT_TOLERANCE_MS;

    if (!keepLocal) {
      progress.anchor = position;
      progress.at = performance.now();
    }
    progress.duration = duration;
    progress.playing = playing;
    renderProgress();
  }

  function setText(title, artist) {
    const key = title + "\u0000" + artist;
    if (key === shownKey) return;
    shownKey = key;

    const incoming = visibleLayer === layerA ? layerB : layerA;
    incoming.querySelector(".artist").textContent = artist || "Unknown artist";
    incoming.querySelector(".title").textContent = title || "Unknown title";

    incoming.classList.remove("show", "out");
    void incoming.offsetWidth;
    incoming.classList.add("show");

    if (visibleLayer && visibleLayer !== incoming) {
      const outgoing = visibleLayer;
      outgoing.classList.remove("show");
      outgoing.classList.add("out");
      outgoing.addEventListener("transitionend", () => {
        outgoing.classList.remove("out");
      }, { once: true });
    }
    visibleLayer = incoming;
  }

  function clearArt() {
    artA.classList.remove("show");
    artB.classList.remove("show");
    bgA.classList.remove("show");
    bgB.classList.remove("show");
    visibleArt = null;
    visibleBg = null;
    shownArt = "";
  }

  function setArt(url) {
    if (!url) {
      clearArt();
      return;
    }
    if (url === shownArt) return;

    const token = ++artToken;
    const loader = new Image();

    loader.onload = () => {
      if (token !== artToken) return;

      const nextArt = visibleArt === artA ? artB : artA;
      nextArt.src = url;
      nextArt.classList.add("show");
      if (visibleArt && visibleArt !== nextArt) visibleArt.classList.remove("show");
      visibleArt = nextArt;

      const nextBg = visibleBg === bgA ? bgB : bgA;
      nextBg.querySelector("img").src = url;
      nextBg.classList.add("show");
      if (visibleBg && visibleBg !== nextBg) visibleBg.classList.remove("show");
      visibleBg = nextBg;

      shownArt = url;
    };

    // A failed image keeps the previous artwork rather than flashing empty.
    loader.onerror = () => {};
    loader.src = url;
  }

  function setOffline() {
    body.classList.add("offline");
    body.classList.add("paused");
    progress.playing = false;
  }

  function apply(data) {
    const updated = data ? Number(data.updated_at) || 0 : 0;
    if (!data || (updated > 1e12 && Date.now() - updated > STALE_MS)) {
      setOffline();
      return;
    }

    const title = typeof data.title === "string" ? data.title.trim() : "";
    const artist = typeof data.artist === "string" ? data.artist.trim() : "";
    if (!title && !artist) {
      setOffline();
      return;
    }

    const key = title + "\u0000" + artist;
    const trackChanged = key !== shownKey;
    const playing = !!data.is_playing;

    body.classList.remove("offline");
    body.classList.toggle("paused", !playing);

    setText(title, artist);
    setArt(data.album_art_url || "");
    setProgress(data, playing, trackChanged || !playing);
  }

  function startScriptMode() {
    if (scriptTag) return;
    mode = "script";
    console.info("[Metrolist] HTTP unavailable, using " + scriptSrc + " fallback.");

    scriptTag = document.createElement("script");
    scriptTag.onload = () => {
      const data = window.METROLIST_NOW_PLAYING;
      window.METROLIST_NOW_PLAYING = null;
      if (data === null || data === undefined) {
        if (++failures >= FAILURES_BEFORE_HIDE) apply(null);
        return;
      }
      failures = 0;
      apply(data);
    };
    scriptTag.onerror = () => {
      if (++failures >= FAILURES_BEFORE_HIDE) apply(null);
    };
    document.head.appendChild(scriptTag);
    loadScript();
  }

  function loadScript() {
    window.METROLIST_NOW_PLAYING = null;
    scriptTag.src = scriptSrc + "?t=" + Date.now();
  }

  async function tick() {
    if (mode === "script") {
      loadScript();
      return;
    }

    try {
      const response = await fetch(bridge + "/nowplaying?t=" + Date.now(), { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      failures = 0;
      apply(data);
    } catch {
      if (++failures >= FAILURES_BEFORE_FALLBACK) startScriptMode();
    }
  }

  if (mode === "script") startScriptMode();
  setInterval(renderProgress, PROGRESS_MS);
  tick();
  setInterval(tick, POLL_MS);
})();
</script>
</body>
</html>
